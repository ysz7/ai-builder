# The database this service needs, with the vector extension its search depends on.
# Bringing it up is an action taken from the node this file carries -- nothing in the
# toolchain starts it on its own.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: notes
      POSTGRES_USER: notes
      POSTGRES_DB: notes
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes"]
      interval: 2s
      timeout: 2s
      retries: 30
