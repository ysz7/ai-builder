# The services this project needs to run. The builder reads this file by asking docker what
# it says -- it never parses it and never rewrites it. Bringing these up is an action a
# person takes; nothing in the toolchain starts them on its own.
services:
  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
