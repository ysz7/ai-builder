[package]
name = "framestack-desktop"
version = "0.1.0"
description = "Tauri shell for Framestack AI Builder. Transport only -- all logic lives in the Python core."
edition = "2021"
rust-version = "1.77.2"

# The Dock shows the *binary's* name, and in dev there is no bundle to correct it: `tauri dev`
# runs this file directly, so `framestack-desktop` was what a person read under the icon. One
# word rather than the product's three because `cargo` refuses a space in a target name -- the
# full name is the bundle's, and the bundle only exists after `npm run build`.
[[bin]]
name = "Framestack"
path = "src/main.rs"

[lib]
name = "framestack_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# A native folder picker. Unlike everything else the webview can reach, this one *cannot*
# be a method in the core: it is an operating-system window, not a capability Python has.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
