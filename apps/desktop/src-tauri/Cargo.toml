[package]
name = "aibuilder-desktop"
version = "0.1.0"
description = "Tauri shell for the AI Builder. Transport only -- all logic lives in the Python core."
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aibuilder_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
