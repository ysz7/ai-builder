[project]
name = "framestack-ai-builder"
version = "0.1.0"
description = "Workspace root. The shippable piece is packages/core."
requires-python = ">=3.10"
dependencies = [
    "framestack-core",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.22.2",
    "ruff>=0.9",
    "mypy>=1.14",
    # The reference project's settings classes. Test-only: the core reads a settings class
    # with libcst and never imports it, so nothing here may become a dependency of the core.
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
framestack-core = { workspace = true }

[tool.pytest.ini_options]
# The reference project's own suite runs here too: it is the run the graph is observed by,
# so a reference whose tests do not pass is a fixture that proves nothing.
# The full example's own suite runs here too: it is the run the graph is observed by, so an
# example whose tests do not pass is a fixture that proves nothing.
#
# The other two examples are run by `scripts/check.sh` in **their own process**, and that is
# not tidiness: all three declare a `rag/` and an `agent/`, because the convention names those
# directories. One interpreter can hold one `rag`, so a single run would import one example's
# package into another example's test. Separate processes are what "an ordinary Python
# project" costs here, and it is the honest price.
testpaths = ["packages/core/tests", "examples/full/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.isort]
# The reference project's own packages, so its imports sort as first-party where it lives.
known-first-party = ["framestack_core", "agent", "api", "rag", "repositories", "worker"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["packages/core/src", "examples/full"]

[[tool.mypy.overrides]]
# libcst ships types, but its matchers module is loose enough to fight strict mode.
module = "libcst.*"
follow_untyped_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
