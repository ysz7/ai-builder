[project]
name = "framestack-core"
version = "0.1.0"
description = "Python core: parser, gates, writer, orchestration. Runs as the Tauri sidecar."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "libcst>=1.9.0",
    # Observe. Both sides of it: the project's suite is run under `coverage run`, and the
    # database it leaves behind is read back through this rather than out of its SQLite --
    # nothing here parses somebody else's file format.
    "coverage>=7.6",
    "ruamel-yaml>=0.18",
]

[project.optional-dependencies]
package = ["pyinstaller>=6.22.2"]

[project.scripts]
framestack-core = "framestack_core.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framestack_core"]
