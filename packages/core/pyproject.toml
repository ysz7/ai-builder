[project]
name = "framestack-core"
version = "0.1.0"
description = "Python core: parser, gates, writer, orchestration. Runs as the Tauri sidecar."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "libcst>=1.9.0",
]

[project.optional-dependencies]
package = ["pyinstaller>=6.22.2"]

[project.scripts]
framestack-core = "framestack_core.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framestack_core"]
